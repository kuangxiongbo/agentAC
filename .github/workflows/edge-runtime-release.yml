# Build client-runtime zip per platform and attach to GitHub Release.
# Tag: edge-runtime-v{version} (e.g. edge-runtime-v2.0.1)
name: Edge runtime release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Client version (package.json if empty)'
        required: false
        type: string
  push:
    tags:
      - 'edge-runtime-v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-aarch64
          - os: macos-13
            platform: darwin-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: mission-control-client/pnpm-lock.yaml

      - name: Package runtime zip
        shell: bash
        env:
          EDGE_RUNTIME_VERSION: ${{ github.event.inputs.version || '' }}
          EDGE_RUNTIME_PLATFORM: ${{ matrix.platform }}
        run: |
          cd mission-control-client
          bash scripts/package-edge-runtime.sh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-runtime-${{ matrix.platform }}
          path: releases/dist/client-runtime-*.zip

  publish-manifest-hint:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/edge-runtime-v')
    steps:
      - run: |
          echo "After all artifacts upload, merge SHA256 into releases/edge-runtime-manifest.json"
          echo "and configure center EDGE_RUNTIME_MANIFEST_PATH or publish static JSON URL."
