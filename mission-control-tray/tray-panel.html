<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Agent Edge</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        color: #fff;
        padding: 0 2px;
        user-select: none;
        -webkit-app-region: drag;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 6px;
        border-radius: 5px;
        background: rgba(28, 28, 30, 0.78);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #e53935;
      }
      .dot.ok { background: #43a047; }
      .brand {
        font-size: 11px;
        font-weight: 600;
        color: #ff8a80;
        white-space: nowrap;
        margin-right: 2px;
      }
      button {
        -webkit-app-region: no-drag;
        border: none;
        border-radius: 4px;
        padding: 1px 7px;
        font-size: 11px;
        font-weight: 600;
        line-height: 18px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
      }
      button.primary { background: #b71c1c; }
      button:hover { filter: brightness(1.12); }
      button.icon {
        padding: 1px 5px;
        font-size: 13px;
        line-height: 16px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="dot" id="status_dot" title="连接状态"></span>
      <span class="brand">Edge</span>
      <button type="button" class="primary" id="open_console">控制台</button>
      <button type="button" id="connection">连接</button>
      <button type="button" class="icon" id="hide_panel" title="隐藏（托盘菜单可再显示）">×</button>
    </div>
    <script>
      const invoke = window.__TAURI__?.core?.invoke;
      async function refreshStatus() {
        if (!invoke) return;
        try {
          const s = await invoke("get_setup_status");
          const dot = document.getElementById("status_dot");
          if (dot && s?.configured) {
            dot.classList.add("ok");
            dot.title = "已配置";
          }
        } catch (_) {}
      }
      document.getElementById("open_console")?.addEventListener("click", () =>
        invoke?.("open_console")
      );
      document.getElementById("connection")?.addEventListener("click", () =>
        invoke?.("open_tray_config_cmd")
      );
      document.getElementById("hide_panel")?.addEventListener("click", () =>
        invoke?.("hide_tray_panel")
      );
      refreshStatus();
      setInterval(refreshStatus, 8000);
    </script>
  </body>
</html>
