# Mission Control — 1Panel / 生产编排推荐
# 环境变量：1Panel 面板填写的变量会写入同目录 1panel.env；本文件已通过 env_file 引用。
# CLI 部署：cp .env.1panel.example 1panel.env 后编辑，再 docker compose -f docker-compose.1panel.yml up -d

services:
  mission-control:
    # 升级版本时改此处 tag，并 docker compose pull && up -d
    image: crpi-c9b9bml2ajb23n5d.cn-shenzhen.personal.cr.aliyuncs.com/1sheng/agentcenter:2.1.13
    container_name: agentcenter
    restart: unless-stopped

    ports:
      # 仅本机监听，由 Nginx/Caddy 反代 HTTPS；直连公网可改为 "3000:3000"
      - "127.0.0.1:3000:3000"

    env_file:
      - 1panel.env

    environment:
      PORT: "3000"
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"

    volumes:
      # 必须：SQLite、tokens、自动生成密钥等
      - mc_1panel_data:/app/.data
      # 可选：若网关/OpenClaw 状态在宿主机，取消下行注释并改主机路径
      # - ${OPENCLAW_HOST_PATH:-/root/.openclaw}:/run/openclaw:ro

    networks:
      - mc_net

    # 与仓库 Dockerfile HEALTHCHECK 一致；便于 1Panel 展示健康状态
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

    # MC 容器访问宿主机上的网关（Linux 需 extra_hosts）
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 只读根文件系统；tmpfs 须与镜像内 USER nextjs（uid/gid 1001）一致，否则无法写图片优化缓存
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
      - /app/.next/cache:uid=1001,gid=1001,mode=0755

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: ${MC_MEMORY_LIMIT:-768M}
          cpus: "${MC_CPU_LIMIT:-1.0}"
        reservations:
          memory: 256M

networks:
  mc_net:
    driver: bridge

volumes:
  mc_1panel_data:
